
# Dokka 2's own task names, which is what the javadoc jar is wired to.
# Without this the plugin runs in 1.x compatibility mode, keeps the old task
# names, and the publish plugin cannot find the one it was told to package.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Dokka 2.0.0 analyses with the legacy descriptor engine by default, and that
# engine does not know JVM target 25 -- it throws IllegalArgumentException: 25
# on a machine running a JDK newer than it. K2 analysis does not go through it.
org.jetbrains.dokka.experimental.tryK2=true
