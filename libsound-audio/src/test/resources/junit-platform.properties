# A deadline on every test, and one that actually interrupts.
#
# JUnit's default thread mode resolves to SAME_THREAD, where a timeout does not
# stop a blocked method -- it waits for it to return and then reports it as
# late. That is no protection at all against the failure this library is most
# likely to have: a blocking write parked on a device that will never drain.
# SEPARATE_THREAD runs the test on its own thread so the deadline can cut it.
junit.jupiter.execution.timeout.default = 120 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
