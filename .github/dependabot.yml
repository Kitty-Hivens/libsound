# What a bot can and cannot cover here.
#
# It reads gradle/libs.versions.toml and the workflows, which is the whole
# declared dependency surface -- the library itself has almost none. The part it
# cannot see is the part that actually breaks: libsound binds to the system's
# libpulse and libdbus, whose ABI no manifest declares. That drift is caught by
# the integration suite against a real server, or it is not caught.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The rows that go stale silently: an action pinned to a major that stops
  # getting security fixes still runs green until it does not.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
