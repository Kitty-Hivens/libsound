name: Oracle

# The ABI oracles, run where their headers live.
#
# Every constant and offset in a backend's ABI table is printed by a small C
# program compiled against the real headers, and never written from memory. For
# libpulse and libdbus that program runs on the maintainer's machine. CoreAudio
# has no such machine, so it runs here, and this workflow is the only way its
# numbers are ever obtained.
#
# Run it by hand from the Actions tab, or by touching the oracle itself. The
# output is transcribed into the Kotlin table by a human reading the log --
# deliberately not generated, because a generator is one more thing that can be
# wrong in a way nobody reads.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/*-oracle.c'
      - '.github/workflows/oracle.yml'

jobs:
  coreaudio:
    name: CoreAudio ABI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: SDK and toolchain, recorded with the numbers they produced
        run: |
          sw_vers
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          clang --version

      - name: Compile the oracle
        run: |
          clang -o /tmp/coreaudio-oracle tools/coreaudio-oracle.c \
            -framework CoreAudio -framework AudioToolbox -framework CoreFoundation

      # Only arm64 runners exist, and Intel Macs do. The oracle asserts every
      # value that reached the Kotlin table, so compiling it for x86_64 -- which
      # cannot be run here, hence syntax only -- turns a different layout there
      # into a compile error instead of something a user finds by hearing
      # nothing.
      - name: The same assertions, laid out for Intel
        run: clang -arch x86_64 -fsyntax-only tools/coreaudio-oracle.c

      - name: Offsets, selectors, and what this runner actually has
        run: /tmp/coreaudio-oracle

      # Whether a process with no bundle can publish a Now Playing session at
      # all. It decides whether the macOS half of libsound-session is worth
      # binding, and the answer is not something to remember.
      #
      # The probe exits zero whether the answer is yes or no -- "no" is a real
      # answer and must not read as a broken row.
      - name: Can a process like this publish a media session
        run: |
          clang -o /tmp/mpnowplaying-probe tools/mpnowplaying-probe.m \
            -framework Foundation -framework MediaPlayer
          /tmp/mpnowplaying-probe

# There is no SMTC row here, deliberately.
#
# tools/smtc-probe.c asks whether the transport controls accept a window the
# library made -- a real question, and unfinished: it compiles against the
# Windows SDK and fails to link, because C mode emits no IID symbol for a WinRT
# interface. Finishing it means rewriting it as C++ around __uuidof.
#
# Running it here would put a permanently red row in front of everyone for a
# question that gates nothing. A failure people learn to walk past is worse than
# no row at all, because the next one they walk past will be real. The probe
# comes back when it works, not before.
