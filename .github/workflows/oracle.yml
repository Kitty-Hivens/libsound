name: Oracle

# The ABI oracles, run where their headers live.
#
# Every constant and offset in a backend's ABI table is printed by a small C
# program compiled against the real headers, and never written from memory. For
# libpulse and libdbus that program runs on the maintainer's machine. CoreAudio
# has no such machine, so it runs here, and this workflow is the only way its
# numbers are ever obtained.
#
# Run it by hand from the Actions tab, or by touching the oracle itself. The
# output is transcribed into the Kotlin table by a human reading the log --
# deliberately not generated, because a generator is one more thing that can be
# wrong in a way nobody reads.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/*-oracle.c'
      - '.github/workflows/oracle.yml'

jobs:
  coreaudio:
    name: CoreAudio ABI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: SDK and toolchain, recorded with the numbers they produced
        run: |
          sw_vers
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          clang --version

      - name: Compile the oracle
        run: |
          clang -o /tmp/coreaudio-oracle tools/coreaudio-oracle.c \
            -framework CoreAudio -framework AudioToolbox -framework CoreFoundation

      # Only arm64 runners exist, and Intel Macs do. The oracle asserts every
      # value that reached the Kotlin table, so compiling it for x86_64 -- which
      # cannot be run here, hence syntax only -- turns a different layout there
      # into a compile error instead of something a user finds by hearing
      # nothing.
      - name: The same assertions, laid out for Intel
        run: clang -arch x86_64 -fsyntax-only tools/coreaudio-oracle.c

      - name: Offsets, selectors, and what this runner actually has
        run: /tmp/coreaudio-oracle

  # Does SMTC accept a window the library made?
  #
  # A behaviour question rather than a layout one, and it decides an API. SMTC
  # has one desktop entry point -- GetForWindow(HWND) -- and a library has no
  # window. Neither does a command line consumer. So either the handle becomes
  # part of libsound's public API and every windowless consumer is locked out,
  # or the library makes its own window, and whether that is allowed has to be
  # run rather than remembered.
  #
  # Wine answers yes, which is worth little: its WinRT is stubbed in places and
  # a stub returns S_OK to everything. This row is the one that counts.
  smtc:
    name: SMTC verdict (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Compiled on Windows with the Windows SDK rather than cross-compiled.
      # Ubuntu's mingw headers are old enough that the WinRT C bindings this
      # uses are not there, so the cross-compile failed on the runner while
      # succeeding against a current mingw locally.
      - name: Compile and ask Windows
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /TC tools\smtc-probe.c /Fe:smtc-probe.exe /link ole32.lib runtimeobject.lib user32.lib
          smtc-probe.exe
          exit /b 0
