name: Publish

# A release is cut from a tag: tag vX.Y.Z, push it, and this signs the three
# artifacts and uploads them to Maven Central. The version comes from the tag,
# not from gradle.properties. The job runs in the maven-central environment, so
# the credentials sit behind that environment's approval rather than firing on
# any pushed tag.
#
# Unlike skinema there is no second publish path here: libsound binds to the
# system's libpulse and libdbus and ships no natives, so there is nothing that
# has to be published separately or held back from a tag.
on:
  push:
    tags: [ "v*", "[0-9]*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0"
        required: true

env:
  JAVA_VERSION: '22'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve the version
        id: version
        env:
          # Through the environment, never interpolated into the script: an
          # expression is substituted while the script is still text, so the
          # checks below would run on a body the input had already rewritten.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
          fi
          case "$v" in
            "") echo "::error::no version -- a dispatched run must pass one"; exit 1 ;;
            [0-9]*) ;;
            *) echo "::error::version '$v' does not start with a digit"; exit 1 ;;
          esac
          case "$v" in
            *[!0-9A-Za-z.-]*) echo "::error::version '$v' has characters a version does not"; exit 1 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # Central versions are immutable, and a reused one is rejected only at the
      # end of the upload -- after everything has been built and signed. All
      # three artifacts share a version line, so checking core is checking all
      # of them.
      - name: Guard the version
        run: |
          v='${{ steps.version.outputs.v }}'
          if curl -fsI -o /dev/null "https://repo1.maven.org/maven2/dev/hivens/libsound-core/$v/libsound-core-$v.pom"; then
            echo "::error::dev.hivens:libsound-core:$v is already on Central -- versions are immutable"
            exit 1
          fi
          echo "publishing $v"

      # The release build needs the same device CI has, and for a sharper
      # reason: without a server every audio suite skips, and a skipped suite is
      # a green tick. The first cut of this workflow ran `build` on a bare
      # runner, so the row that decides what reaches Maven Central was the one
      # row that asserted nothing.
      - name: Start a sound server with a null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins
          export XDG_RUNTIME_DIR=/tmp/libsound-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=libsound_test
          printf 'pcm.!default pulse\nctl.!default pulse\n' | sudo tee /etc/asound.conf
          pactl info
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      # The tag is what ships, so it is tested here rather than on the trust
      # that main was green when it was cut.
      - name: Build + test
        env:
          LIBSOUND_REQUIRE: pulse,javasound
        run: ./gradlew build --stacktrace

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # The in-memory key is what makes the build skip useGpgCmd; the
          # publish tasks do not survive the configuration cache.
          ./gradlew publishToMavenCentral \
            -PappVersion='${{ steps.version.outputs.v }}' \
            --no-configuration-cache
