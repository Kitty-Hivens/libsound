name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '22'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # What audio exists on each runner, before anything is built on the answer.
  # A row with no output device turns every hardware suite into a skip, and a
  # skip nobody notices reads exactly like a pass. LIBSOUND_REQUIRE can only
  # name a backend on a row that could satisfy it, so the rows have to be
  # measured rather than assumed.
  probe:
    name: Audio environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Native audio, as the platform reports it
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-*)
              echo "-- CoreAudio devices --"
              system_profiler SPAudioDataType 2>/dev/null || echo "(system_profiler said nothing)"
              ;;
            windows-*)
              echo "-- audio endpoints --"
              powershell -Command "Get-CimInstance Win32_SoundDevice | Format-Table Name,Status" || true
              ;;
            *)
              echo "-- ALSA cards --"
              cat /proc/asound/cards 2>/dev/null || echo "(no cards)"
              ;;
          esac

      - name: JavaSound, which is what the fallback suite needs
        run: java tools/probe/AudioEnvProbe.java

  build:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      # A runner has no audio device, so one is created. Linux is the cheap
      # case: a null sink is a module load. Windows and macOS would need a
      # driver installed, which is why their rows verify only what needs no
      # device and the rest is checked on real hardware.
      - name: Start a sound server with a null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins
          export XDG_RUNTIME_DIR=/tmp/libsound-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=libsound_test
          # Point ALSA's default at the same server, so the JavaSound fallback
          # is exercised against the graph it actually reaches on a desktop
          # rather than being skipped for want of a card.
          printf 'pcm.!default pulse\nctl.!default pulse\n' | sudo tee /etc/asound.conf
          pactl info
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      # LIBSOUND_REQUIRE names what this row is for. A named backend that turns
      # out to be unavailable fails the build instead of skipping, because a
      # skipped hardware suite and a passing one are the same shade of green --
      # which is how skinema shipped a subtitle bundle that exported no symbols.
      - name: Build + test
        env:
          LIBSOUND_REQUIRE: pulse,javasound
        run: ./gradlew build --stacktrace

      # A green tick says the build did not fail; it does not say a hardware
      # suite ran. LIBSOUND_REQUIRE covers a missing backend, this covers the
      # other half -- a suite that reached zero tests with the backend present.
      - name: What each suite actually did
        if: always()
        env:
          LIBSOUND_EXPECT: PulseSink,PulseMixer,PulseBackend,JavaSound
        run: python3 .github/test-summary.py

      # The publishable artifacts, built before a release depends on them. The
      # javadoc jar in particular: left to itself the publish plugin packages
      # the *Java* javadoc tool's output for a project with no Java sources,
      # which was a manifest and nothing else -- 25 bytes that satisfied
      # Central's requirement and carried none of the documentation.
      - name: The javadoc jars carry the KDoc
        run: |
          ./gradlew dokkaJavadocJar --stacktrace
          # Named pages rather than a file count: most of a Dokka jar is
          # stylesheets and scripts, so a threshold would pass on a jar that
          # documented nothing at all.
          documents() {
            jar=$(ls "$1"/build/libs/*javadoc*.jar)
            if ! unzip -l "$jar" | grep -q "$2"; then
              echo "FAIL: $1 ships a javadoc jar with no page for $2"
              unzip -l "$jar" | head -30
              exit 1
            fi
            echo "$1: documents $2 ($(unzip -l "$jar" | tail -1 | awk '{print $2}') entries)"
          }
          documents libsound-core AudioSink
          documents libsound-audio AudioBackends
          documents libsound-session MediaSessions

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/reports/tests/test'
          retention-days: 7

  # macOS runners have an output device that works -- "Apple Virtual Sound
  # Device", which the ABI oracle measured before any of the backend was
  # written. So the same contract suite every other backend passes runs here for
  # real, and LIBSOUND_REQUIRE names coreaudio: a skipped hardware suite reads
  # exactly like a passing one, and this row exists to tell them apart.
  #
  # Windows has no such device, which is why there is no equivalent row for it
  # and why docs/TESTING.md exists instead.
  macos:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Which devices CoreAudio offers, before the suite runs on them
        run: system_profiler SPAudioDataType || true

      - name: Build + test
        env:
          LIBSOUND_REQUIRE: coreaudio
        run: ./gradlew build --stacktrace

      - name: What each suite actually did
        if: always()
        env:
          LIBSOUND_EXPECT: CoreAudioSinkContract,CoreAudioBackend
        run: python3 .github/test-summary.py

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: '**/build/reports/tests/test'
          retention-days: 7
