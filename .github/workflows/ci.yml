name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '22'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # What audio exists on each runner, before anything is built on the answer.
  # A row with no output device turns every hardware suite into a skip, and a
  # skip nobody notices reads exactly like a pass. LIBSOUND_REQUIRE can only
  # name a backend on a row that could satisfy it, so the rows have to be
  # measured rather than assumed.
  probe:
    name: Audio environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Native audio, as the platform reports it
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-*)
              echo "-- CoreAudio devices --"
              system_profiler SPAudioDataType 2>/dev/null || echo "(system_profiler said nothing)"
              ;;
            windows-*)
              echo "-- audio endpoints --"
              powershell -Command "Get-CimInstance Win32_SoundDevice | Format-Table Name,Status" || true
              ;;
            *)
              echo "-- ALSA cards --"
              cat /proc/asound/cards 2>/dev/null || echo "(no cards)"
              ;;
          esac

      - name: JavaSound, which is what the fallback suite needs
        run: java tools/probe/AudioEnvProbe.java

  build:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      # A runner has no audio device, so one is created. Linux is the cheap
      # case: a null sink is a module load. Windows and macOS would need a
      # driver installed, which is why their rows verify only what needs no
      # device and the rest is checked on real hardware.
      - name: Start a sound server with a null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins
          export XDG_RUNTIME_DIR=/tmp/libsound-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=libsound_test
          # Point ALSA's default at the same server, so the JavaSound fallback
          # is exercised against the graph it actually reaches on a desktop
          # rather than being skipped for want of a card.
          printf 'pcm.!default pulse\nctl.!default pulse\n' | sudo tee /etc/asound.conf
          pactl info
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      # LIBSOUND_REQUIRE names what this row is for. A named backend that turns
      # out to be unavailable fails the build instead of skipping, because a
      # skipped hardware suite and a passing one are the same shade of green --
      # which is how skinema shipped a subtitle bundle that exported no symbols.
      - name: Build + test
        env:
          LIBSOUND_REQUIRE: pulse,javasound
        run: ./gradlew build --stacktrace

      # A green tick says the build did not fail; it does not say a hardware
      # suite ran. LIBSOUND_REQUIRE covers a missing backend, this covers the
      # other half -- a suite that reached zero tests with the backend present.
      - name: What each suite actually did
        if: always()
        env:
          LIBSOUND_EXPECT: PulseSink,PulseMixer,PulseBackend,JavaSound
        run: python3 .github/test-summary.py

      # The publishable artifacts, built before a release depends on them. The
      # javadoc jar in particular: left to itself the publish plugin packages
      # the *Java* javadoc tool's output for a project with no Java sources,
      # which was a manifest and nothing else -- 25 bytes that satisfied
      # Central's requirement and carried none of the documentation.
      - name: The javadoc jars carry the KDoc
        run: |
          ./gradlew dokkaJavadocJar --stacktrace
          # Named pages rather than a file count: most of a Dokka jar is
          # stylesheets and scripts, so a threshold would pass on a jar that
          # documented nothing at all. Dokka dasherises a type name into its
          # path, so AudioSink is looked for as -audio-sink.
          documents() {
            jar=$(ls "$1"/build/libs/*javadoc*.jar)
            # -qF -- because a Dokka path starts with a dash, which grep would
            # otherwise read as one of its own options.
            if ! unzip -l "$jar" | grep -qF -- "$2"; then
              echo "FAIL: $1 ships a javadoc jar with no page for $2"
              echo "pages it does have:"
              unzip -l "$jar" | grep -F "index.html" | head -40
              exit 1
            fi
            echo "$1: documents $2 ($(unzip -l "$jar" | tail -1 | awk '{print $2}') entries)"
          }
          documents libsound-core -audio-sink/index.html
          documents libsound-audio -audio-backends/index.html
          documents libsound-session -media-sessions/index.html

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/reports/tests/test'
          retention-days: 7

  # macOS runners have an output device that works -- "Apple Virtual Sound
  # Device", which the ABI oracle measured before any of the backend was
  # written. So the same contract suite every other backend passes runs here for
  # real, and LIBSOUND_REQUIRE names coreaudio: a skipped hardware suite reads
  # exactly like a passing one, and this row exists to tell them apart.
  #
  # Windows has no such device, which is why there is no equivalent row for it
  # and why docs/TESTING.md exists instead.
  macos:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Which devices CoreAudio offers, before the suite runs on them
        run: system_profiler SPAudioDataType || true

      - name: Build + test
        env:
          LIBSOUND_REQUIRE: coreaudio
        run: ./gradlew build --stacktrace

      - name: What each suite actually did
        if: always()
        env:
          LIBSOUND_EXPECT: CoreAudioSinkContract,CoreAudioBackend
        run: python3 .github/test-summary.py

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: '**/build/reports/tests/test'
          retention-days: 7

  # The Windows ABI, checked without a Windows machine.
  #
  # Wine is a bad oracle for behaviour and a good one for ABI: it does not
  # emulate anything, it reimplements the same interfaces with the same vtable
  # slots and the same GUIDs, because otherwise real Windows programs would not
  # run on it. Matching the ABI is its job rather than a side effect.
  #
  # And the ABI is exactly what this backend risks. A slot index is a plain
  # integer: calling the wrong one invokes a different function through the
  # signature you declared, and nothing at runtime checks it. Here that becomes
  # a red build on the push that introduced it.
  #
  # This is NOT "Windows is tested". It says nothing about real hardware,
  # device switching, Bluetooth latency, or what a row looks like in the real
  # volume mixer. docs/TESTING.md is still what answers those, and still needs
  # a person.
  windows-abi:
    name: Windows ABI (wine, not hardware)
    runs-on: ubuntu-latest
    env:
      WINDOWS_JDK: 'https://github.com/adoptium/temurin22-binaries/releases/download/jdk-22.0.2%2B9/OpenJDK22U-jdk_x64_windows_hotspot_22.0.2_9.zip'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Wine, and a sound server for its WASAPI to sit on
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 xvfb pulseaudio pulseaudio-utils
          wine --version
          export XDG_RUNTIME_DIR=/tmp/libsound-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=libsound_test
          pactl info
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$HOME/.wine-libsound" >> "$GITHUB_ENV"
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"

      # 200 MB, and the same bytes on every run. Cached rather than fetched.
      - name: Cache the Windows JDK
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ~/windows-jdk
          key: windows-jdk-22.0.2+9

      - name: Fetch the Windows JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/windows-jdk
          curl -sL -o /tmp/jdk-win.zip "$WINDOWS_JDK"
          unzip -q /tmp/jdk-win.zip -d ~/windows-jdk

      - name: Build the classes the Windows JVM will run
        run: ./gradlew :libsound-audio:testClasses :libsound-audio:smokeClasspath

      - name: The smoke check, on a Windows JVM
        run: |
          set -o pipefail
          xvfb-run -a wineboot -i
          java_exe=$(find ~/windows-jdk -name java.exe | head -1)
          classpath=$(while read -r entry; do winepath -w "$entry"; done \
            < libsound-audio/build/smoke-classpath.txt | paste -sd';')
          xvfb-run -a wine "$java_exe" --enable-native-access=ALL-UNNAMED \
            -cp "$classpath" dev.hivens.libsound.audio.smoke.SmokeCheckKt \
            < /dev/null 2>&1 | tee /tmp/smoke.log || true
          # The verdict is the next step's, not this one's. The check exits
          # non-zero when anything failed, including the wine gap this job
          # knowingly tolerates -- and a wine that never started leaves a log
          # with no backend line, which the next step catches anyway.

      # The exit code alone would pass on a fallback. A machine where WASAPI
      # refuses to open still plays audio through JavaSound and still answers
      # every check correctly -- so a run that never touched the code this job
      # exists for would be exactly as green as one that did.
      # The exit code alone would pass on a fallback. A machine where WASAPI
      # refuses to open still plays through JavaSound and still answers every
      # check correctly -- so a run that never touched the code this job exists
      # for would be exactly as green as one that did.
      #
      # The two tolerated failures are named rather than counted. Ubuntu ships
      # wine 9.0, whose IAudioSessionManager2 enumerates no sessions at all
      # even with one of ours rendering; the same check passes on wine 11.14.
      # So those two are a gap in the tool, and every other failure is ours.
      - name: It was WASAPI that ran, and not the fallback
        run: |
          echo "wine: $(wine --version)"
          grep -q "^backend       wasapi" /tmp/smoke.log \
            || { echo "FAIL: the smoke check did not select the WASAPI backend"; exit 1; }
          grep -q "no mixer here" /tmp/smoke.log \
            && { echo "FAIL: the Windows mixer did not open at all"; exit 1; }

          # tr -d '\r' because the check ran on a Windows JVM, which ends its
          # lines with CRLF. Without it every label carries a trailing carriage
          # return and the exact-line match below can never succeed.
          tr -d '\r' < /tmp/smoke.log | grep "^FAIL  " | sed 's/^FAIL  //' > /tmp/failed || true
          unexpected=$(grep -vxF \
            -e "the mixer lists at least one stream" \
            -e "the mixer sees the stream this process just opened" \
            /tmp/failed || true)
          if [ -n "$unexpected" ]; then
            echo "FAIL: checks failed that wine is expected to pass:"
            echo "$unexpected"
            exit 1
          fi
          echo "WASAPI output path executed; session enumeration is unverified here"
          echo "(wine 9.0 gap, not a claim about Windows -- see docs/TESTING.md)"

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-abi-smoke-log
          path: /tmp/smoke.log
          retention-days: 7
